<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Snuffy</title>
<style>
:root{--bg:#000;--card:rgba(255,255,255,.035);--border:rgba(255,255,255,.05);--text:#e8e8ea;--muted:#7a7a85;--btn:rgba(255,255,255,.05);--nav:rgba(12,12,14,.9);--sheet:rgba(14,14,16,.97);--well:rgba(0,0,0,.4);--item:rgba(255,255,255,.03);--active:rgba(255,255,255,.11);--disc:#26262b}
[data-theme=light]{--bg:#f2f2f4;--card:rgba(255,255,255,.7);--border:rgba(0,0,0,.06);--text:#1a1a1f;--muted:#6b6b75;--btn:rgba(255,255,255,.9);--nav:rgba(255,255,255,.92);--sheet:rgba(250,250,252,.98);--well:rgba(0,0,0,.05);--item:rgba(0,0,0,.03);--active:rgba(0,0,0,.07);--disc:#3a3a42}
*{box-sizing:border-box;margin:0;padding:0;scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
html,body{height:100%;background:var(--bg);color:var(--text)}
body{font-family:system-ui,Roboto,Arial,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
a{color:var(--text)}
[hidden]{display:none!important}

.app{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column}
.screen{flex:1;overflow-y:auto;padding:34px 12px calc(96px + env(safe-area-inset-bottom))}

.top{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:0 2px 12px}
.brand{font-size:19px;font-weight:800;text-align:center}
.muted{color:var(--muted);font-size:13px}
h2{font-size:15px;font-weight:700;margin-bottom:10px}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 12px}
.page-title{font-size:20px;font-weight:800}

.card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:14px;width:100%;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 6px 14px rgba(0,0,0,.25)}
.view{display:none;flex-direction:column;gap:12px}
.view.active{display:flex}

button{font:inherit;color:var(--text);background:var(--btn);border:1px solid var(--border);
  border-radius:16px;padding:10px 14px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.25);
  transition:transform .05s;outline:none;-webkit-user-select:none;user-select:none;text-decoration:none}
button:active{box-shadow:inset 2px 3px 6px rgba(0,0,0,.4);transform:scale(.97)}
button.on{font-weight:700}
button.round{width:46px;height:46px;border-radius:50%;padding:0;font-size:16px;display:inline-flex;align-items:center;justify-content:center}
button.big{width:62px;height:62px;border-radius:50%;padding:0;font-size:20px;display:inline-flex;align-items:center;justify-content:center}
button.circle{width:40px;height:40px;border-radius:50%;padding:0;font-size:17px;display:inline-flex;align-items:center;justify-content:center}
button.small{padding:8px 12px;border-radius:14px;font-size:12px}
button.danger{color:#ff8a8a}
button.primary{font-weight:700}
button.ghost{background:transparent;border:0;box-shadow:none;width:100%;height:56px;padding:0;border-radius:16px}
button.ghost:active{box-shadow:none;transform:none}
.row{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}

/* player */
.now{text-align:center;padding:26px 16px 30px}
.now .title{font-size:18px;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;line-height:1.3}
.now .artist{margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{margin-top:6px;font-size:13px;color:var(--muted)}

.disc{width:170px;height:170px;margin:24px auto;border-radius:50%;position:relative;
  background:radial-gradient(circle,var(--disc) 0 16%,#0a0a0a 17% 62%,#000 63%);box-shadow:0 6px 14px rgba(0,0,0,.4)}
.disc::after{content:"";position:absolute;top:50%;left:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:#1a1a1f;box-shadow:inset 2px 2px 4px #000}
.disc.spin{animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.progress{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:11px;color:var(--muted)}
/* bar is a tall touch area; the visible line is drawn with ::before */
.bar{flex:1;height:26px;position:relative;touch-action:none;cursor:pointer}
.bar::before{content:"";position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;border-radius:4px;background:var(--well)}
.bar i{position:absolute;left:0;top:50%;height:4px;margin-top:-2px;width:0;border-radius:4px;background:var(--text);opacity:.6}
.bar .knob{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--text);box-shadow:0 2px 6px rgba(0,0,0,.5);pointer-events:none}

.search,.form{display:flex;gap:8px;align-items:center;padding:4px;border-radius:16px;background:var(--well);width:100%}
.search input,.form input{flex:1;border:0;outline:0;background:transparent;color:var(--text);font:inherit;padding:11px 12px;min-width:0}
.search input::placeholder,.form input::placeholder{color:var(--muted)}
.search button,.form button{padding:9px 14px;flex-shrink:0;border-radius:14px}

.list{display:grid;gap:8px;width:100%}
.item{display:flex;align-items:center;gap:10px;padding:7px;border-radius:16px;background:var(--item);min-width:0}
.item.active{background:var(--active)}
.item img,.item .ph{width:42px;height:42px;border-radius:12px;object-fit:cover;flex-shrink:0;background:var(--btn)}
.item .meta{flex:1;min-width:0}
.item .t{font-weight:600;font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.item .a{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.acts{display:flex;gap:5px;flex-shrink:0}
.acts button{width:31px;height:31px;padding:0;border-radius:50%;font-size:11px}

.album{display:flex;align-items:center;gap:10px;padding:9px;border-radius:18px;background:var(--item);cursor:pointer;min-width:0}
.album .cover{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--btn);flex-shrink:0;font-size:18px}
.album .meta{flex:1;min-width:0}
.album .t{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.album .a{font-size:11px;color:var(--muted)}

.nav{position:absolute;bottom:0;left:0;right:0;z-index:5;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;
  padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:var(--nav);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--border)}
.tab{background:none;border:0;box-shadow:none;border-radius:16px;padding:7px 0;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tab:active{transform:scale(.96)}
.tab .i{font-size:17px}
.tab.on{color:var(--text);font-weight:700;background:var(--btn)}

.overlay{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-height:70%;padding:16px;border-radius:26px 26px 0 0;display:flex;flex-direction:column;gap:10px;background:var(--sheet);border-top:1px solid var(--border)}
.sheet-list{display:grid;gap:8px;overflow:auto;max-height:40vh}
.sheet-actions{display:flex;gap:8px}
.sheet-actions button{flex:1}

/* side menu */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:20}
.drawer{position:absolute;top:0;bottom:0;left:0;width:80%;max-width:300px;z-index:21;background:var(--sheet);
  border-right:1px solid var(--border);padding:40px 14px 20px;transform:translateX(-105%);transition:transform .25s ease;
  overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.drawer.open{transform:none}
.profile-btn{display:flex;align-items:center;width:100%;padding:16px;border-radius:20px;text-align:left;font-weight:700;font-size:16px}
.mi{display:flex;width:100%;justify-content:space-between;align-items:center;text-align:left;border-radius:999px;padding:12px 16px}
.drawer .foot{margin-top:auto;font-size:12px;color:var(--muted);line-height:1.5;padding-top:10px}

/* full pages */
.fullpage{position:absolute;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
.fullpage .phead{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:34px 14px 12px}
.fullpage .phead .pt{text-align:center;font-weight:800;font-size:17px}
.fullpage .pbody{flex:1;overflow-y:auto;padding:4px 18px 36px;display:flex;flex-direction:column;gap:14px}
.fullpage h3{font-size:15px;font-weight:700;margin-top:6px}
.fullpage p{font-size:14px;line-height:1.65;color:var(--text);opacity:.92}
.fullpage .updated{font-size:12px;color:var(--muted)}
.fullpage .legal{margin-top:18px;font-size:12px;color:var(--muted);text-align:center;line-height:1.6}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--muted);font-weight:600}
.field .well{display:flex;align-items:center;gap:8px;border-radius:16px;background:var(--well);padding:4px 4px 4px 12px}
.field input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font:inherit;padding:11px 0}
.field input::placeholder{color:var(--muted)}
.datepick{position:relative;width:40px;height:40px;border-radius:12px;background:var(--btn);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.datepick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.datepick span{pointer-events:none;font-size:16px}
select.sel{font:inherit;color:var(--text);background:var(--btn);border:1px solid var(--border);border-radius:14px;padding:12px;width:100%}
.note{font-size:12px;color:var(--muted);min-height:16px}
</style>
</head>
<body>
<div class="app">
  <div class="screen" id="screen">
    <header class="top">
      <button class="circle" id="setBtn" title="Menu" aria-label="Menu">☰</button>
      <div class="brand">Snuffy ♫</div>
      <button class="circle" id="themeBtn" title="Theme" aria-label="Theme">☾</button>
    </header>

    <section class="view active" id="view-home">
      <div class="card now">
        <div class="title" id="title">No Track</div>
        <div class="artist muted" id="artist"></div>
        <div class="status" id="status">Stopped</div>
        <div class="disc" id="disc"></div>
        <div class="progress">
          <span id="cur">0:00</span>
          <div class="bar" id="bar"><i id="barFill"></i><span class="knob" id="knob"></span></div>
          <span id="dur">0:00</span>
        </div>
        <div class="row" style="margin-top:14px">
          <button class="round" id="shuffleBtn" data-act="ctrl" data-c="shuffle">⤨</button>
          <button class="round" data-act="ctrl" data-c="prev">⏮</button>
          <button class="big" id="playBtn" data-act="ctrl" data-c="toggle">▶</button>
          <button class="round" data-act="ctrl" data-c="next">⏭</button>
          <button class="round" id="repeatBtn" data-act="ctrl" data-c="repeat">↻</button>
        </div>
        <div style="margin-top:6px"><button class="ghost" data-act="pickfile" aria-label="Open files"></button></div>
      </div>

      <div class="card">
        <h2>Search</h2>
        <div class="search">
          <input id="q" placeholder="Search songs or artists…" autocomplete="off">
          <button id="goBtn">Go</button>
        </div>
      </div>

      <div class="card" id="resultsPanel" hidden>
        <h2>Results</h2>
        <div class="list" id="results"></div>
      </div>

      <div class="card">
        <h2>Queue</h2>
        <div class="list" id="queue"><div class="muted">Nothing queued yet.</div></div>
      </div>
    </section>

    <section class="view" id="view-albums">
      <div class="head">
        <button class="small" id="albumBack" data-act="backalbum" hidden>‹ Back</button>
        <div class="page-title" id="albumsTitle">Albums</div>
        <span></span>
      </div>
      <div class="card" id="newAlbumBox">
        <h2>Create album</h2>
        <div class="form">
          <input id="albumName" placeholder="Album name…" autocomplete="off" maxlength="40">
          <button class="primary small" data-act="createalbum">Create</button>
        </div>
      </div>
      <div class="row" id="albumTools" hidden>
        <button class="small" data-act="playall" data-list="album">▶ Play all</button>
        <button class="small" data-act="playall" data-list="album" data-shuffle="1">⤨ Shuffle</button>
        <button class="small danger" data-act="delalbum">🗑 Delete album</button>
      </div>
      <div class="card"><div class="list" id="albumsBox"></div></div>
    </section>

    <section class="view" id="view-liked">
      <div class="head">
        <div class="page-title">Liked songs</div>
        <span class="muted" id="likedCount"></span>
      </div>
      <div class="row">
        <button class="small" data-act="playall" data-list="liked">▶ Play all</button>
        <button class="small" data-act="playall" data-list="liked" data-shuffle="1">⤨ Shuffle</button>
      </div>
      <div class="card"><div class="list" id="likedBox"></div></div>
    </section>
  </div>

  <nav class="nav">
    <button class="tab on" data-tab="home"><span class="i">⌂</span>Home</button>
    <button class="tab" data-tab="albums"><span class="i">▤</span>Albums</button>
    <button class="tab" data-tab="liked"><span class="i">♥</span>Liked</button>
  </nav>

  <div class="overlay" id="sheet" hidden>
    <div class="sheet">
      <h2>Add to album</h2>
      <div class="sheet-list" id="sheetList"></div>
      <div class="sheet-actions"><button data-act="closesheet">Cancel</button></div>
    </div>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer">
    <button class="profile-btn card" data-page="profile"><span id="pName">Your profile</span></button>
    <button class="mi card" data-page="settings">Settings <span>›</span></button>
    <button class="mi card" data-page="privacy">Privacy Policy <span>›</span></button>
    <button class="mi card" data-page="terms">Terms &amp; Conditions <span>›</span></button>
    <div class="foot">Snuffy™ · made by Irfan S<br>© 2026 All rights reserved.</div>
  </aside>

  <section class="fullpage" id="page" hidden>
    <div class="phead">
      <button class="circle" id="pageBack" aria-label="Back">‹</button>
      <div class="pt" id="pageTitle"></div>
      <span></span>
    </div>
    <div class="pbody" id="pageBody"></div>
  </section>
</div>

<input type="file" id="fileInput" accept="audio/*,.txt,text/plain" multiple hidden>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; };
const post = (url, body) => fetch(url, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)}).then(r => r.json());
const LS = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

(function () {
  const realFetch = window.fetch.bind(window);
  const json = obj => new Response(JSON.stringify(obj), { headers: { "Content-Type": "application/json" } });
  window.fetch = function (url, opts) {
    const u = String(url);
    if (!u.startsWith("/api/")) return realFetch(url, opts);
    const parts = u.split("?");
    const path = parts[0];
    const p = new URLSearchParams(parts[1] || "");
    let body = {};
    try { body = opts && typeof opts.body === "string" ? JSON.parse(opts.body) : {}; } catch (e) {}
    if (path === "/api/status") return Promise.resolve(json(JSON.parse(AndroidBridge.status())));
    if (path === "/api/control") { AndroidBridge.control(body.action || "", String(body.value ?? "")); return Promise.resolve(json({ ok: true })); }
    if (path === "/api/queue") { AndroidBridge.setQueue(JSON.stringify(body.items || []), body.index || 0); return Promise.resolve(json({ ok: true })); }
    if (path === "/api/search") return new Promise(resolve => {
      window.__searchRes = list => resolve(json({ results: list }));
      AndroidBridge.search(p.get("q") || "");
    });
    return Promise.resolve(json({ error: "Not available in the app" }));
  };
})();

/* theme: dark or light, default dark */
function applyTheme() {
  const m = LS.get("snuffy.theme", "dark");
  document.documentElement.dataset.theme = m === "light" ? "light" : "dark";
  $("themeBtn").textContent = m === "light" ? "☀" : "☾";
}
function toggleTheme() {
  LS.set("snuffy.theme", LS.get("snuffy.theme", "dark") === "light" ? "dark" : "light");
  applyTheme();
}

/* state */
let st = {}, queueSig = "", sheetItem = null, lastResults = [], openAlbumId = null;
let seeking = false, dragPct = 0, dragging = false;
let albums = LS.get("snuffy.albums", []);
let liked = LS.get("snuffy.liked", []);
let currentQueue = LS.get("snuffy.queue", []);
let profile = LS.get("snuffy.profile", { name: "", dob: "", email: "" });

const clean = i => ({ id: i.id || null, uri: i.uri || "", title: i.title || "Unknown", artist: i.artist || "", thumb: i.thumb || "" });
const keyOf = i => i.id ? `v:${i.id}` : i.uri ? `u:${i.uri}` : `t:${i.title}|${i.artist || ""}`;
const isLiked = i => liked.some(x => keyOf(x) === keyOf(i));
const saveAll = () => { LS.set("snuffy.albums", albums); LS.set("snuffy.liked", liked); LS.set("snuffy.queue", currentQueue); };
const openAlbum = () => albums.find(a => a.id === openAlbumId);
const queueItems = () => currentQueue.length ? currentQueue : (st.queue || []);

function currentItem() {
  const t = st.track;
  if (!t) return null;
  const c = currentQueue[st.index];
  if (c && c.title === t.title) return c;
  return clean({ title: t.title, artist: t.artist, thumb: t.thumb });
}
function getList(name) {
  if (name === "search") return lastResults;
  if (name === "liked") return liked;
  if (name === "queue") return queueItems();
  if (name === "album") return openAlbum() ? openAlbum().tracks : [];
  return [];
}
function thumbHTML(i) {
  return i.thumb ? `<img src="${esc(i.thumb)}" alt="" loading="lazy">` : `<div class="ph"></div>`;
}
function row(item, list, idx, o = {}) {
  const on = isLiked(item);
  const add = o.add !== false;
  const rm = o.rm ? `<button data-act="rmtrack" data-i="${idx}" title="Remove">×</button>` : "";
  return `<div class="item ${o.active ? "active" : ""}">
    ${thumbHTML(item)}
    <div class="meta"><div class="t">${esc(item.title)}</div><div class="a">${esc(item.artist)}</div></div>
    <div class="acts">
      <button data-act="play" data-list="${list}" data-i="${idx}">▶</button>
      <button class="${on ? "on" : ""}" data-act="like" data-list="${list}" data-i="${idx}">${on ? "♥" : "♡"}</button>
      ${add ? `<button data-act="addalbum" data-list="${list}" data-i="${idx}">+</button>` : ""}
      ${rm}
    </div></div>`;
}

/* playback */
async function playList(items, index = 0) {
  if (!items.length) return;
  currentQueue = items.map(clean);
  saveAll();
  await post("/api/queue", { items: currentQueue, index });
  refresh();
}
async function control(action, value) { await post("/api/control", { action, value }); refresh(); }

window.__localTracks = arr => playList(arr.map(x => ({ id: null, uri: x.uri, title: x.title, artist: "On this phone" })), 0);
window.__fileLines = lines => playList(lines.map(t => ({ id: null, title: t, artist: "File" })), 0);

function openFilePicker() {
  if (window.AndroidBridge) AndroidBridge.pickFile();
  else $("fileInput").click();
}
$("fileInput").addEventListener("change", e => {
  const files = [...e.target.files];
  const audio = files.filter(f => !/\.txt$/i.test(f.name));
  if (audio.length) window.__localTracks(audio.map(f => ({ uri: URL.createObjectURL(f), title: f.name })));
  e.target.value = "";
});

/* progress bar: the round knob can be dragged or tapped to move the song */
function pctFromClientX(clientX) {
  const r = $("bar").getBoundingClientRect();
  return Math.min(1, Math.max(0, (clientX - r.left) / r.width));
}
function paintProgress(pct, seconds) {
  const s = (pct * 100) + "%";
  $("barFill").style.width = s;
  $("knob").style.left = s;
  $("cur").textContent = fmt(seconds);
}
$("bar").addEventListener("pointerdown", e => {
  if (!(st.duration > 0)) return;
  dragging = true; seeking = true;
  $("bar").setPointerCapture(e.pointerId);
  dragPct = pctFromClientX(e.clientX);
  paintProgress(dragPct, dragPct * st.duration);
});
$("bar").addEventListener("pointermove", e => {
  if (!dragging) return;
  dragPct = pctFromClientX(e.clientX);
  paintProgress(dragPct, dragPct * st.duration);
});
function endDrag() {
  if (!dragging) return;
  dragging = false;
  seeking = false;
  control("seek", dragPct * st.duration);
}
$("bar").addEventListener("pointerup", endDrag);
$("bar").addEventListener("pointercancel", endDrag);

/* likes */
function toggleLike(item) {
  if (!item) return;
  const k = keyOf(item);
  liked = isLiked(item) ? liked.filter(x => keyOf(x) !== k) : [...liked, clean(item)];
  saveAll(); renderAll();
}

/* albums */
function createAlbumFromPage() {
  const name = $("albumName").value.trim();
  if (!name) return;
  albums.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name, tracks: [] });
  saveAll();
  $("albumName").value = "";
  renderAlbums();
}
function openSheet(item) { sheetItem = clean(item); renderSheet(); $("sheet").hidden = false; }
function closeSheet() { $("sheet").hidden = true; sheetItem = null; }
function renderSheet() {
  $("sheetList").innerHTML = albums.length
    ? albums.map(a => `<div class="album" data-act="pick" data-id="${esc(a.id)}">
        <div class="cover">♫</div>
        <div class="meta"><div class="t">${esc(a.name)}</div><div class="a">${a.tracks.length} songs</div></div></div>`).join("")
    : '<div class="muted">No albums yet. Create one in the Albums tab.</div>';
}
function pickAlbum(id) {
  const a = albums.find(x => x.id === id);
  if (!a || !sheetItem) return;
  if (!a.tracks.some(t => keyOf(t) === keyOf(sheetItem))) a.tracks.push(sheetItem);
  saveAll(); closeSheet(); renderAlbums();
}
function removeTrack(i) { const a = openAlbum(); if (!a) return; a.tracks.splice(i, 1); saveAll(); renderAlbums(); }
function deleteAlbum() {
  const a = openAlbum(); if (!a) return;
  albums = albums.filter(x => x.id !== a.id);
  openAlbumId = null; saveAll(); renderAlbums();
}
function renderAlbums() {
  const a = openAlbum();
  if (openAlbumId && !a) openAlbumId = null;
  if (a) {
    $("albumsTitle").textContent = a.name;
    $("albumBack").hidden = false;
    $("newAlbumBox").hidden = true;
    $("albumTools").hidden = false;
    $("albumsBox").innerHTML = a.tracks.length
      ? a.tracks.map((t, i) => row(t, "album", i, { add: false, rm: true })).join("")
      : '<div class="muted">This album is empty. Tap + on any song to add it.</div>';
  } else {
    $("albumsTitle").textContent = "Albums";
    $("albumBack").hidden = true;
    $("newAlbumBox").hidden = false;
    $("albumTools").hidden = true;
    $("albumsBox").innerHTML = albums.length
      ? albums.map(al => `<div class="album" data-act="openalbum" data-id="${esc(al.id)}">
          <div class="cover">♫</div>
          <div class="meta"><div class="t">${esc(al.name)}</div><div class="a">${al.tracks.length} songs</div></div></div>`).join("")
      : '<div class="muted">No albums yet. Create one above.</div>';
  }
}

/* date of birth: digits only, slashes always shown (DD/MM/YYYY), backspace removes digits */
function digitsOnly(s) { return String(s || "").replace(/\D/g, "").slice(0, 8); }
function maskDob(digits) {
  let out = digits.slice(0, 2);
  if (digits.length >= 2) out += "/" + digits.slice(2, 4);
  if (digits.length >= 4) out += "/" + digits.slice(4, 8);
  return out;
}
function displayToIso(s) {
  const m = String(s || "").match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if (!m) return "";
  const [_, d, mo, y] = m;
  const dt = new Date(`${y}-${mo}-${d}T00:00:00`);
  if (isNaN(dt) || dt.getDate() !== Number(d) || dt.getMonth() + 1 !== Number(mo)) return "";
  return `${y}-${mo}-${d}`;
}
function isoToDisplay(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-");
  return y && m && d ? `${d}/${m}/${y}` : "";
}
function syncCalendar() {
  const iso = displayToIso($("pfDobText").value);
  if (iso) $("pfDobPick").value = iso;
}

function renderProfileHeader() {
  $("pName").textContent = profile.name || "Your profile";
}
function profileForm() {
  return `
    <div class="field"><label for="pfName">Name</label>
      <div class="well"><input id="pfName" value="${esc(profile.name)}" placeholder="Your name" autocomplete="off"></div></div>
    <div class="field"><label for="pfDobText">Date of birth</label>
      <div class="well">
        <input id="pfDobText" value="${esc(isoToDisplay(profile.dob))}" placeholder="DD/MM/YYYY" inputmode="numeric" autocomplete="off" maxlength="10">
        <label class="datepick" title="Pick from calendar"><span>📅</span>
          <input type="date" id="pfDobPick" value="${esc(profile.dob)}">
        </label>
      </div></div>
    <div class="field"><label for="pfEmail">Email</label>
      <div class="well"><input id="pfEmail" type="email" value="${esc(profile.email)}" placeholder="you@example.com" autocomplete="off"></div></div>
    <div class="row"><button class="primary" data-act="saveprofile">Save</button></div>
    <div class="note" id="pfNote"></div>`;
}
function saveProfile() {
  const name = $("pfName").value.trim();
  const dobText = $("pfDobText").value.trim();
  const dob = $("pfDobPick").value || displayToIso(dobText);
  const email = $("pfEmail").value.trim();
  if (dobText && !dob) { $("pfNote").textContent = "Date should be DD/MM/YYYY, or pick it from the calendar."; return; }
  profile = { name, dob, email };
  LS.set("snuffy.profile", profile);
  renderProfileHeader();
  $("pfNote").textContent = "Saved.";
}

/* side menu and full pages */
const PAGE_TITLES = { profile: "Profile", settings: "Settings", privacy: "Privacy Policy", terms: "Terms & Conditions" };
const LEGAL_FOOT = `<div class="legal">© 2026 Snuffy™. All rights reserved.</div>`;
const PAGES = {
  profile: () => profileForm(),
  settings: () => `
    <h3>Sound quality</h3>
    <p class="muted">Choose how audio should sound. Your choice is saved on this phone.</p>
    <select class="sel" onchange="LS.set('snuffy.quality', this.value)">
      <option value="auto" ${LS.get("snuffy.quality","auto")==="auto"?"selected":""}>Auto</option>
      <option value="high" ${LS.get("snuffy.quality","auto")==="high"?"selected":""}>High</option>
      <option value="data" ${LS.get("snuffy.quality","auto")==="data"?"selected":""}>Data saver</option>
    </select>
    ${LEGAL_FOOT}`,
  privacy: () => `
    <p class="updated">Last updated: October 2026</p>
    <p>Snuffy respects your privacy. This policy explains what information the app uses and how it is handled.</p>
    <h3>Information stored on your device</h3>
    <p>Your albums, liked songs, queue, theme choice and profile details are stored only on your device. They are not sent to any server by Snuffy.</p>
    <h3>Audio files</h3>
    <p>Audio files you open from your phone are played directly from your device. Snuffy does not upload, copy or share them.</p>
    <h3>Online search and playback</h3>
    <p>When you search or play a YouTube song, the request is sent to YouTube. YouTube's own terms and privacy policy apply to that content.</p>
    <h3>Profile details</h3>
    <p>If you add a name, date of birth or email, they are used only inside the app on your device. Snuffy does not verify them.</p>
    <h3>Your choices</h3>
    <p>You can change or remove your profile details at any time. Uninstalling Snuffy removes all data stored on the device.</p>
    <h3>Contact</h3>
    <p>For questions about this policy, use the project page linked in Terms &amp; Conditions.</p>
    ${LEGAL_FOOT}`,
  terms: () => `
    <p class="updated">Last updated: October 2026</p>
    <p>By using Snuffy you agree to these terms. If you do not agree, please do not use the app.</p>
    <h3>Personal use</h3>
    <p>Snuffy is provided for personal, non-commercial use. Play only music you have the right to listen to.</p>
    <h3>Your content</h3>
    <p>You are responsible for the files you open and the searches you make.</p>
    <h3>No warranty</h3>
    <p>Snuffy is provided as it is, without warranty of any kind. Availability of online songs depends on third-party services.</p>
    <h3>Changes</h3>
    <p>These terms may change. Continued use of the app means you accept the updated terms.</p>
    <h3>Project</h3>
    <p>Visit the project page: <a href="https://github.com/irfannzz18">github.com/irfannzz18</a></p>
    ${LEGAL_FOOT}`
};
function openDrawer() { $("drawer").classList.add("open"); $("scrim").hidden = false; }
function closeDrawer() { $("drawer").classList.remove("open"); $("scrim").hidden = true; }
function openPage(name) {
  $("pageTitle").textContent = PAGE_TITLES[name];
  $("pageBody").innerHTML = PAGES[name]();
  $("pageBody").scrollTop = 0;
  $("page").hidden = false;
  closeDrawer();
}
function closePage() { $("page").hidden = true; }

/* rendering */
function render() {
  const t = st.track || {};
  $("title").textContent = t.title || "No Track";
  $("artist").textContent = t.artist || "";
  const playing = st.state === "playing" && !st.paused;
  let label = "Stopped";
  if (st.state === "loading") label = "Loading…";
  else if (st.state === "error") label = st.error || "Error";
  else if (st.state === "playing") label = st.paused ? "Paused" : "Playing";
  $("status").textContent = label;
  $("disc").classList.toggle("spin", playing);
  $("playBtn").textContent = (playing || st.state === "loading") ? "❚❚" : "▶";
  $("shuffleBtn").classList.toggle("on", !!st.shuffle);
  $("repeatBtn").classList.toggle("on", !!st.repeat);
  if (!seeking) {
    const pos = st.position || 0, dur = st.duration || 0;
    paintProgress(dur ? Math.min(1, pos / dur) : 0, pos);
    $("dur").textContent = fmt(dur);
  }
  const sig = `${queueItems().length}:${st.index}:${st.state}:${liked.length}:${t.title || ""}`;
  if (sig !== queueSig) { queueSig = sig; renderQueue(); }
}
function renderQueue() {
  const q = queueItems();
  $("queue").innerHTML = q.length
    ? q.map((item, i) => row(item, "queue", i, { active: i === st.index })).join("")
    : '<div class="muted">Nothing queued yet.</div>';
}
function renderSearch() {
  $("resultsPanel").hidden = !lastResults.length && !$("results").dataset.busy;
  $("results").innerHTML = lastResults.map((r, i) => row(r, "search", i)).join("");
}
function renderLiked() {
  $("likedCount").textContent = liked.length ? `${liked.length} songs` : "";
  $("likedBox").innerHTML = liked.length
    ? liked.map((t, i) => row(t, "liked", i, { add: false })).join("")
    : '<div class="muted">No liked songs yet. Tap ♡ on any song.</div>';
}
function renderAll() {
  queueSig = ""; renderQueue(); renderSearch(); renderLiked(); renderAlbums(); renderProfileHeader();
  if (!$("sheet").hidden) renderSheet();
}
function setView(name) {
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === "view-" + name));
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.tab === name));
  if (name === "liked") renderLiked();
  if (name === "albums") renderAlbums();
  $("screen").scrollTo({top: 0});
}
async function refresh() {
  try { st = await fetch("/api/status").then(r => r.json()); render(); } catch (e) {}
}

/* search */
async function search() {
  const q = $("q").value.trim();
  if (!q) return;
  $("resultsPanel").hidden = false;
  $("results").dataset.busy = "1";
  $("results").innerHTML = '<div class="muted">Searching…</div>';
  try {
    const r = await fetch("/api/search?q=" + encodeURIComponent(q)).then(r => r.json());
    lastResults = r.results || [];
  } catch (e) { lastResults = []; }
  delete $("results").dataset.busy;
  renderSearch();
  if (!lastResults.length) $("results").innerHTML = '<div class="muted">No results.</div>';
}

/* events */
document.addEventListener("click", e => {
  const page = e.target.closest("[data-page]");
  if (page) return openPage(page.dataset.page);
  const tab = e.target.closest("[data-tab]");
  if (tab) return setView(tab.dataset.tab);
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act;
  const list = b.dataset.list;
  const i = Number(b.dataset.i);
  const items = list ? getList(list) : null;
  switch (act) {
    case "ctrl":        control(b.dataset.c); break;
    case "pickfile":    openFilePicker(); break;
    case "likenow":     toggleLike(currentItem()); break;
    case "addnow":      { const ci = currentItem(); if (ci) openSheet(ci); break; }
    case "play":        playList(items, i); break;
    case "like":        toggleLike(items[i]); break;
    case "addalbum":    openSheet(items[i]); break;
    case "pick":        pickAlbum(b.dataset.id); break;
    case "closesheet":  closeSheet(); break;
    case "createalbum": createAlbumFromPage(); break;
    case "openalbum":   openAlbumId = b.dataset.id; renderAlbums(); break;
    case "backalbum":   openAlbumId = null; renderAlbums(); break;
    case "delalbum":    deleteAlbum(); break;
    case "rmtrack":     removeTrack(i); break;
    case "saveprofile": saveProfile(); break;
    case "playall": {
      let l = [...getList(list)];
      if (b.dataset.shuffle) l.sort(() => Math.random() - 0.5);
      playList(l, 0); break;
    }
  }
});

/* date field: digits only, slashes added automatically */
document.addEventListener("input", e => {
  if (e.target.id !== "pfDobText") return;
  e.target.value = maskDob(digitsOnly(e.target.value));
  syncCalendar();
});
document.addEventListener("keydown", e => {
  if (e.target.id !== "pfDobText" || e.key !== "Backspace") return;
  e.preventDefault();
  const digits = digitsOnly(e.target.value).slice(0, -1);
  e.target.value = maskDob(digits);
  syncCalendar();
});
document.addEventListener("change", e => {
  if (e.target.id === "pfDobPick" && e.target.value) {
    const [y, m, d] = e.target.value.split("-");
    $("pfDobText").value = `${d}/${m}/${y}`;
  }
});

$("themeBtn").onclick = toggleTheme;
$("setBtn").onclick = openDrawer;
$("scrim").onclick = closeDrawer;
$("pageBack").onclick = closePage;
$("albumName").addEventListener("keydown", e => { if (e.key === "Enter") createAlbumFromPage(); });
$("sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeSheet(); });
$("goBtn").onclick = search;
$("q").addEventListener("keydown", e => { if (e.key === "Enter") search(); });

applyTheme();
renderAll();
refresh();
setInterval(refresh, 1000);
</script>
</body>
