<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Snuffy</title>
<style>
:root{--bg:#000;--card:rgba(255,255,255,.035);--border:rgba(255,255,255,.05);--text:#e8e8ea;--muted:#8a8a93;--btn:rgba(255,255,255,.07);--nav:rgba(12,12,14,.92);--sheet:rgba(14,14,16,.97);--well:rgba(0,0,0,.4);--item:rgba(255,255,255,.04);--active:rgba(255,255,255,.14);--disc:#26262b;--accent:#1ed760;--accent-text:#041b0c}
[data-theme=light]{--bg:#f2f2f4;--card:rgba(255,255,255,.7);--border:rgba(0,0,0,.06);--text:#1a1a1f;--muted:#6b6b75;--btn:rgba(0,0,0,.05);--nav:rgba(255,255,255,.94);--sheet:rgba(250,250,252,.98);--well:rgba(0,0,0,.05);--item:rgba(0,0,0,.035);--active:rgba(0,0,0,.09);--disc:#3a3a42;--accent:#1db954;--accent-text:#ffffff}
*{box-sizing:border-box;margin:0;padding:0;scrollbar-width:none!important;-ms-overflow-style:none!important}
*::-webkit-scrollbar{display:none!important;width:0!important;height:0!important}
html,body{height:100%;background:var(--bg);color:var(--text)}
body{font-family:system-ui,Roboto,Arial,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
a{color:var(--text)}
[hidden]{display:none!important}

.app{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column}
.screen{flex:1;overflow-y:auto;padding:34px 12px calc(150px + env(safe-area-inset-bottom))}

.top{position:relative;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:0 2px 10px}
.brand{font-size:19px;font-weight:800;text-align:center}
.file-hit{position:absolute;top:0;right:56px;width:56px;height:40px;background:transparent;border:0;box-shadow:none;padding:0;border-radius:12px}
.file-hit:active{transform:none;box-shadow:none}
.muted{color:var(--muted);font-size:13px}
h2{font-size:15px;font-weight:700;margin-bottom:10px}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 12px}
.page-title{font-size:20px;font-weight:800}
.section-title{font-size:18px;font-weight:800;margin:20px 2px 10px}

/* toggle chips, green when active */
.chips{display:flex;gap:8px;padding:0 2px 14px;overflow-x:auto}
.chip{flex-shrink:0;border-radius:999px;padding:8px 16px;font-size:13px;font-weight:600;background:var(--btn);border:0;box-shadow:none;color:var(--text)}
.chip.on{background:var(--accent);color:var(--accent-text)}

.card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:14px;width:100%;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 6px 14px rgba(0,0,0,.25)}
.view{display:none;flex-direction:column;gap:12px}
.view.active{display:flex}

button{font:inherit;color:var(--text);background:var(--btn);border:1px solid var(--border);
  border-radius:16px;padding:10px 14px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.25);
  transition:transform .05s;outline:none;-webkit-user-select:none;user-select:none;text-decoration:none}
button:active{box-shadow:inset 2px 3px 6px rgba(0,0,0,.4);transform:scale(.97)}
button.on{background:var(--active);font-weight:700}
button.round{width:46px;height:46px;border-radius:50%;padding:0;font-size:16px;display:inline-flex;align-items:center;justify-content:center}
button.big{width:62px;height:62px;border-radius:50%;padding:0;font-size:20px;display:inline-flex;align-items:center;justify-content:center}
button.circle{width:40px;height:40px;border-radius:50%;padding:0;font-size:17px;display:inline-flex;align-items:center;justify-content:center}
button.small{padding:8px 12px;border-radius:14px;font-size:12px}
button.danger{color:#ff8a8a}
button.primary{font-weight:700}
.row{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}

/* home tiles */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button.qp{display:flex;align-items:center;gap:10px;padding:0;min-height:56px;border-radius:12px;background:var(--item);border:1px solid var(--border);box-shadow:none;text-align:left;font-weight:700;font-size:13px;overflow:hidden;min-width:0}
button.qp .qi{width:56px;height:56px;min-width:56px;display:grid;place-items:center;background:var(--btn);font-size:18px}
button.qp span.lbl{padding-right:8px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
button.qp small{display:block;font-weight:400;color:var(--muted);font-size:11px;margin-top:2px}
.hrow{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 6px}
button.acard{flex:0 0 130px;background:transparent;border:0;border-radius:14px;padding:0;text-align:left;box-shadow:none}
button.acard:active{transform:scale(.97)}
.acover{height:130px;border-radius:12px;background:linear-gradient(135deg,var(--btn),var(--item));display:grid;place-items:center;font-size:30px;margin-bottom:8px}
.acard .at{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.acard .aa{font-size:11px;color:var(--muted);margin-top:2px}

/* mini player above the tab bar */
.mini{position:absolute;left:10px;right:10px;bottom:calc(66px + env(safe-area-inset-bottom));z-index:4;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:14px;background:var(--sheet);border:1px solid var(--border);box-shadow:0 6px 16px rgba(0,0,0,.35)}
.mini-info{flex:1;min-width:0;cursor:pointer}
.mini .mt{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .ma{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini button.circle{width:36px;height:36px;font-size:14px}

.search,.form{display:flex;gap:8px;align-items:center;padding:4px;border-radius:16px;background:var(--well);width:100%}
.search input,.form input{flex:1;border:0;outline:0;background:transparent;color:var(--text);font:inherit;padding:11px 12px;min-width:0}
.search input::placeholder,.form input::placeholder{color:var(--muted)}
.search button,.form button{padding:9px 14px;flex-shrink:0;border-radius:14px}

.list{display:grid;gap:8px;width:100%}
.item{display:flex;align-items:center;gap:10px;padding:7px;border-radius:12px;background:var(--item);min-width:0}
.item.active{background:var(--active)}
.item img,.item .ph{width:44px;height:44px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--btn)}
.item .meta{flex:1;min-width:0}
.item .t{font-weight:600;font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.item .a{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.acts{display:flex;gap:5px;flex-shrink:0}
.acts button{width:31px;height:31px;padding:0;border-radius:50%;font-size:11px}

.album{display:flex;align-items:center;gap:10px;padding:9px;border-radius:14px;background:var(--item);cursor:pointer;min-width:0}
.album .cover{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;background:var(--btn);flex-shrink:0;font-size:18px}
.album .meta{flex:1;min-width:0}
.album .t{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.album .a{font-size:11px;color:var(--muted)}

.nav{position:absolute;bottom:0;left:0;right:0;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:var(--nav);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--border)}
.tab{background:none;border:0;box-shadow:none;border-radius:12px;padding:6px 0;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tab:active{transform:scale(.96)}
.tab .i{font-size:17px}
.tab.on{color:var(--text);font-weight:700}

.overlay{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-height:70%;padding:16px;border-radius:26px 26px 0 0;display:flex;flex-direction:column;gap:10px;background:var(--sheet);border-top:1px solid var(--border)}
.sheet-list{display:grid;gap:8px;overflow:auto;max-height:40vh}
.sheet-actions{display:flex;gap:8px}
.sheet-actions button{flex:1}

/* side menu */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:20}
.drawer{position:absolute;top:0;bottom:0;left:0;width:80%;max-width:300px;z-index:21;background:var(--sheet);
  border-right:1px solid var(--border);padding:40px 14px 20px;transform:translateX(-105%);transition:transform .25s ease;
  overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.drawer.open{transform:none}
.profile-btn{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:20px;text-align:left}
.avatar{width:44px;height:44px;min-width:44px;border-radius:50%;display:grid;place-items:center;background:var(--btn);border:1px solid var(--border);font-weight:800;font-size:18px}
.pname{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi{display:flex;width:100%;justify-content:space-between;align-items:center;text-align:left;border-radius:999px;padding:12px 16px}
.drawer .foot{margin-top:auto;font-size:12px;color:var(--muted);line-height:1.5;padding-top:10px}

/* full pages (profile, settings, legal) */
.fullpage{position:absolute;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
.fullpage .phead{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:34px 14px 12px}
.fullpage .phead .pt{text-align:center;font-weight:800;font-size:17px}
.fullpage .pbody{flex:1;overflow-y:auto;padding:4px 18px 36px;display:flex;flex-direction:column;gap:14px}
.fullpage h3{font-size:15px;font-weight:700;margin-top:6px}
.fullpage p{font-size:14px;line-height:1.65;color:var(--text);opacity:.92}
.fullpage .updated{font-size:12px;color:var(--muted)}
.fullpage .legal{margin-top:18px;font-size:12px;color:var(--muted);text-align:center;line-height:1.6}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--muted);font-weight:600}
.field .well{display:flex;align-items:center;gap:8px;border-radius:16px;background:var(--well);padding:4px 4px 4px 12px}
.field input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font:inherit;padding:11px 0}
.field input::placeholder{color:var(--muted)}
.datepick{position:relative;width:40px;height:40px;border-radius:12px;background:var(--btn);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.datepick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.datepick span{pointer-events:none;font-size:16px}
select.sel{font:inherit;color:var(--text);background:var(--btn);border:1px solid var(--border);border-radius:14px;padding:12px;width:100%}
.note{font-size:12px;color:var(--muted);min-height:16px}

/* full-screen player */
.progress{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:11px;color:var(--muted)}
.bar{flex:1;height:26px;position:relative;touch-action:none;cursor:pointer}
.bar::before{content:"";position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;border-radius:4px;background:var(--well)}
.bar i{position:absolute;left:0;top:50%;height:4px;margin-top:-2px;width:0;border-radius:4px;background:var(--text);opacity:.6}
.bar .knob{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--text);box-shadow:0 2px 6px rgba(0,0,0,.5);touch-action:none}
.pfrom{font-size:11px;color:var(--muted)}
.pfrom-name{font-size:14px;font-weight:700}
.pcover{width:100%;aspect-ratio:1/1;border-radius:14px;background:var(--btn);display:grid;place-items:center;font-size:64px;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.35)}
.pcover img{width:100%;height:100%;object-fit:cover}
.ptr{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.pttl{font-size:20px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pctl{display:flex;justify-content:space-between;align-items:center;padding:0 6px}
button.on#pLike{color:var(--accent)}
.lyr-head,.about-head{display:flex;align-items:center;gap:10px}
.lyr-head h2{margin:0;flex:1}
.lyr-body{white-space:pre-line;font-size:16px;line-height:1.7;font-weight:700;margin:12px 0;min-height:24px}
.tin{width:100%;min-height:150px;border:0;outline:0;background:var(--well);color:var(--text);font:inherit;padding:12px;border-radius:14px;resize:vertical;margin:10px 0}
.bio{font-size:13px;color:var(--muted);line-height:1.6;margin:10px 0;white-space:pre-line}
</style>
</head>
<body>
<div class="app">
  <div class="screen" id="screen">
    <header class="top">
      <button class="circle" id="setBtn" title="Menu" aria-label="Menu">☰</button>
      <div class="brand">Snuffy ♫</div>
      <button class="circle" id="themeBtn" title="Theme" aria-label="Theme">☾</button>
      <button class="file-hit" data-act="pickfile" aria-label="Open files"></button>
    </header>

    <section class="view active" id="view-home">
      <div class="chips" id="homeChips">
        <button class="chip on" data-filter="all">All</button>
        <button class="chip" data-filter="music">Music</button>
        <button class="chip" data-filter="albums">Albums</button>
      </div>

      <div id="secRecents">
        <div class="section-title">Recents</div>
        <div class="grid2" id="recentsBox"></div>
      </div>

      <div id="secAlbums">
        <div class="section-title">Your albums</div>
        <div class="hrow" id="homeAlbums"></div>
      </div>

      <div id="secQueue">
        <div class="section-title">Queue</div>
        <div class="card">
          <div class="list" id="queue"><div class="muted">Nothing queued yet.</div></div>
        </div>
      </div>
    </section>

    <section class="view" id="view-search">
      <div class="card">
        <h2>Search</h2>
        <div class="search">
          <input id="q" placeholder="Search songs or artists…" autocomplete="off">
          <button id="goBtn">Go</button>
        </div>
      </div>
      <div class="card" id="resultsPanel" hidden>
        <h2>Results</h2>
        <div class="list" id="results"></div>
      </div>
    </section>

    <section class="view" id="view-library">
      <div class="head">
        <div class="page-title">Your library</div>
      </div>
      <div class="grid2">
        <button class="qp" data-tab="liked"><span class="qi">♥</span><span class="lbl">Liked songs<small id="libLiked"></small></span></button>
        <button class="qp" data-tab="albums"><span class="qi">▤</span><span class="lbl">Albums<small id="libAlbums"></small></span></button>
      </div>
      <div class="card">
        <h2>Your albums</h2>
        <div class="list" id="libBox"></div>
      </div>
    </section>

    <section class="view" id="view-albums">
      <div class="head">
        <button class="small" id="albumBack" data-act="backalbum" hidden>‹ Back</button>
        <div class="page-title" id="albumsTitle">Albums</div>
        <span></span>
      </div>
      <div class="card" id="newAlbumBox">
        <h2>Create album</h2>
        <div class="form">
          <input id="albumName" placeholder="Album name…" autocomplete="off" maxlength="40">
          <button class="primary small" data-act="createalbum">Create</button>
        </div>
      </div>
      <div class="row" id="albumTools" hidden>
        <button class="small" data-act="playall" data-list="album">▶ Play all</button>
        <button class="small" data-act="playall" data-list="album" data-shuffle="1">⤨ Shuffle</button>
        <button class="small danger" data-act="delalbum">🗑 Delete album</button>
      </div>
      <div class="card"><div class="list" id="albumsBox"></div></div>
    </section>

    <section class="view" id="view-liked">
      <div class="head">
        <div class="page-title">Liked songs</div>
        <span class="muted" id="likedCount"></span>
      </div>
      <div class="row">
        <button class="small" data-act="playall" data-list="liked">▶ Play all</button>
        <button class="small" data-act="playall" data-list="liked" data-shuffle="1">⤨ Shuffle</button>
      </div>
      <div class="card"><div class="list" id="likedBox"></div></div>
    </section>
  </div>

  <div class="mini" id="mini" hidden>
    <div class="mini-info" data-act="openplayer">
      <div class="mt" id="miniTitle"></div>
      <div class="ma" id="miniArtist"></div>
    </div>
    <button class="circle" id="miniPlay" data-act="ctrl" data-c="toggle">▶</button>
    <button class="circle" data-act="ctrl" data-c="next">⏭</button>
  </div>

  <nav class="nav">
    <button class="tab on" data-tab="home"><span class="i">⌂</span>Home</button>
    <button class="tab" data-tab="search"><span class="i">⌕</span>Search</button>
    <button class="tab" data-tab="library"><span class="i">▤</span>Library</button>
    <button class="tab" data-tab="create"><span class="i">＋</span>Create</button>
  </nav>

  <div class="overlay" id="sheet" hidden>
    <div class="sheet">
      <h2>Add to album</h2>
      <div class="sheet-list" id="sheetList"></div>
      <div class="sheet-actions"><button data-act="closesheet">Cancel</button></div>
    </div>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer">
    <button class="profile-btn card" data-page="profile">
      <div class="avatar" id="avatar">?</div>
      <div class="pname" id="pName">Your profile</div>
    </button>
    <button class="mi card" data-page="settings">Settings <span>›</span></button>
    <button class="mi card" data-page="privacy">Privacy Policy <span>›</span></button>
    <button class="mi card" data-page="terms">Terms &amp; Conditions <span>›</span></button>
    <div class="foot">Snuffy™ · made by Irfan S<br>© 2026 All rights reserved.</div>
  </aside>

  <section class="fullpage" id="page" hidden>
    <div class="phead">
      <button class="circle" id="pageBack" aria-label="Back">‹</button>
      <div class="pt" id="pageTitle"></div>
      <span></span>
    </div>
    <div class="pbody" id="pageBody"></div>
  </section>

  <section class="fullpage" id="player" hidden>
    <div class="phead">
      <button class="circle" data-act="closeplayer" aria-label="Close player">⌄</button>
      <div class="pt">
        <div class="pfrom">Playing from</div>
        <div class="pfrom-name" id="pFrom"></div>
      </div>
      <span></span>
    </div>
    <div class="pbody">
      <div class="pcover" id="pCover"></div>

      <div class="ptr">
        <div class="grow">
          <div class="pttl" id="pTitle"></div>
          <div class="muted" id="pArtist"></div>
        </div>
        <button class="circle" id="pLike" data-act="likenow" aria-label="Like">♡</button>
      </div>

      <div class="progress">
        <span id="pCur">0:00</span>
        <div class="bar" id="pBar"><i id="pFill"></i><span class="knob" id="pKnob"></span></div>
        <span id="pDur">0:00</span>
      </div>

      <div class="pctl">
        <button class="round" id="pShuffle" data-act="ctrl" data-c="shuffle">⤨</button>
        <button class="round" data-act="ctrl" data-c="prev">⏮</button>
        <button class="big" id="pPlay" data-act="ctrl" data-c="toggle">▶</button>
        <button class="round" data-act="ctrl" data-c="next">⏭</button>
        <button class="round" id="pRepeat" data-act="ctrl" data-c="repeat">↻</button>
      </div>

      <div class="card lyr">
        <div class="lyr-head">
          <h2>Lyrics preview</h2>
          <button class="small" id="lyrEdit" data-act="editlyrics">Add lyrics</button>
        </div>
        <div class="lyr-body" id="lyrBody"></div>
        <div id="lyrEditor" hidden>
          <textarea class="tin" id="lyrText" placeholder="Paste the lyrics here…"></textarea>
          <div class="row">
            <button class="small" data-act="cancellyrics">Cancel</button>
            <button class="small primary" data-act="savelyrics">Save</button>
          </div>
        </div>
        <div class="row"><button class="small" id="lyrToggle" data-act="togglelyrics">Show lyrics</button></div>
      </div>

      <div class="card about">
        <div class="about-head">
          <div class="avatar" id="aAvatar">♫</div>
          <div class="grow"><div class="pttl" id="aName"></div></div>
          <button class="small" id="bioEdit" data-act="editbio">Edit</button>
        </div>
        <p class="bio" id="bioText"></p>
        <div id="bioEditor" hidden>
          <textarea class="tin" id="bioInput" placeholder="Write something about this artist…"></textarea>
          <div class="row">
            <button class="small" data-act="cancelbio">Cancel</button>
            <button class="small primary" data-act="savebio">Save</button>
          </div>
        </div>
        <div class="row" id="artistActs" style="gap:8px;margin-top:6px">
          <button class="small" data-act="songsby">Songs by this artist</button>
          <button class="small" data-act="similar">Similar to this song</button>
        </div>
      </div>
    </div>
  </section>
</div>

<input type="file" id="fileInput" accept="audio/*,.txt,text/plain" multiple hidden>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; };
const post = (url, body) => fetch(url, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)}).then(r => r.json());
const LS = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

(function () {
  const realFetch = window.fetch.bind(window);
  const json = obj => new Response(JSON.stringify(obj), { headers: { "Content-Type": "application/json" } });
  window.fetch = function (url, opts) {
    const u = String(url);
    if (!u.startsWith("/api/")) return realFetch(url, opts);
    const parts = u.split("?");
    const path = parts[0];
    const p = new URLSearchParams(parts[1] || "");
    let body = {};
    try { body = opts && typeof opts.body === "string" ? JSON.parse(opts.body) : {}; } catch (e) {}
    if (path === "/api/status") return Promise.resolve(json(JSON.parse(AndroidBridge.status())));
    if (path === "/api/control") { AndroidBridge.control(body.action || "", String(body.value ?? "")); return Promise.resolve(json({ ok: true })); }
    if (path === "/api/queue") { AndroidBridge.setQueue(JSON.stringify(body.items || []), body.index || 0); return Promise.resolve(json({ ok: true })); }
    if (path === "/api/search") return new Promise(resolve => {
      window.__searchRes = list => resolve(json({ results: list }));
      AndroidBridge.search(p.get("q") || "");
    });
    return Promise.resolve(json({ error: "Not available in the app" }));
  };
})();

/* theme: dark or light, default dark */
function applyTheme() {
  const m = LS.get("snuffy.theme", "dark");
  document.documentElement.dataset.theme = m === "light" ? "light" : "dark";
  $("themeBtn").textContent = m === "light" ? "☀" : "☾";
}
function toggleTheme() {
  LS.set("snuffy.theme", LS.get("snuffy.theme", "dark") === "light" ? "dark" : "light");
  applyTheme();
}

/* state */
let st = {}, queueSig = "", sheetItem = null, lastResults = [], openAlbumId = null;
let homeFilter = "all";
let pDragging = false, pDragPct = 0;
let lyricsOpen = false, lyricsEditKey = null, bioEditKey = null;
let albums = LS.get("snuffy.albums", []);
let liked = LS.get("snuffy.liked", []);
let currentQueue = LS.get("snuffy.queue", []);
let profile = LS.get("snuffy.profile", { name: "", dob: "", email: "" });
let lyrics = LS.get("snuffy.lyrics", {});
let artistBios = LS.get("snuffy.artists", {});

const clean = i => ({ id: i.id || null, uri: i.uri || "", title: i.title || "Unknown", artist: i.artist || "", thumb: i.thumb || "" });
const keyOf = i => i.id ? `v:${i.id}` : i.uri ? `u:${i.uri}` : `t:${i.title}|${i.artist || ""}`;
const isLiked = i => liked.some(x => keyOf(x) === keyOf(i));
const saveAll = () => { LS.set("snuffy.albums", albums); LS.set("snuffy.liked", liked); LS.set("snuffy.queue", currentQueue); };
const openAlbum = () => albums.find(a => a.id === openAlbumId);
const queueItems = () => currentQueue.length ? currentQueue : (st.queue || []);

function currentItem() {
  const t = st.track;
  if (!t) return null;
  const c = currentQueue[st.index];
  if (c && c.title === t.title) return c;
  return clean({ title: t.title, artist: t.artist, thumb: t.thumb });
}
function getList(name) {
  if (name === "search") return lastResults;
  if (name === "liked") return liked;
  if (name === "queue") return queueItems();
  if (name === "album") return openAlbum() ? openAlbum().tracks : [];
  return [];
}
function thumbHTML(i) {
  return i.thumb ? `<img src="${esc(i.thumb)}" alt="" loading="lazy">` : `<div class="ph"></div>`;
}
function row(item, list, idx, o = {}) {
  const on = isLiked(item);
  const add = o.add !== false;
  const rm = o.rm ? `<button data-act="rmtrack" data-i="${idx}" title="Remove">×</button>` : "";
  return `<div class="item ${o.active ? "active" : ""}">
    ${thumbHTML(item)}
    <div class="meta"><div class="t">${esc(item.title)}</div><div class="a">${esc(item.artist)}</div></div>
    <div class="acts">
      <button data-act="play" data-list="${list}" data-i="${idx}">▶</button>
      <button class="${on ? "on" : ""}" data-act="like" data-list="${list}" data-i="${idx}">${on ? "♥" : "♡"}</button>
      ${add ? `<button data-act="addalbum" data-list="${list}" data-i="${idx}">+</button>` : ""}
      ${rm}
    </div></div>`;
}

/* playback */
async function playList(items, index = 0) {
  if (!items.length) return;
  currentQueue = items.map(clean);
  saveAll();
  await post("/api/queue", { items: currentQueue, index });
  refresh();
}
async function control(action, value) { await post("/api/control", { action, value }); refresh(); }

window.__localTracks = arr => playList(arr.map(x => ({ id: null, uri: x.uri, title: x.title, artist: "On this phone" })), 0);
window.__fileLines = lines => playList(lines.map(t => ({ id: null, title: t, artist: "File" })), 0);

function openFilePicker() {
  if (window.AndroidBridge) AndroidBridge.pickFile();
  else $("fileInput").click();
}
$("fileInput").addEventListener("change", e => {
  const files = [...e.target.files];
  const audio = files.filter(f => !/\.txt$/i.test(f.name));
  if (audio.length) window.__localTracks(audio.map(f => ({ uri: URL.createObjectURL(f), title: f.name })));
  e.target.value = "";
});

/* player progress bar: drag the knob or tap the line to move the song */
const pctOf = (el, x) => { const r = el.getBoundingClientRect(); return Math.min(1, Math.max(0, (x - r.left) / r.width)); };
function paintPlayerBar(pct, seconds) {
  const s = (pct * 100) + "%";
  $("pFill").style.width = s;
  $("pKnob").style.left = s;
  $("pCur").textContent = fmt(seconds);
}
$("pBar").addEventListener("pointerdown", e => {
  if (!(st.duration > 0)) return;
  pDragging = true;
  $("pBar").setPointerCapture(e.pointerId);
  pDragPct = pctOf($("pBar"), e.clientX);
  paintPlayerBar(pDragPct, pDragPct * st.duration);
});
$("pBar").addEventListener("pointermove", e => {
  if (!pDragging) return;
  pDragPct = pctOf($("pBar"), e.clientX);
  paintPlayerBar(pDragPct, pDragPct * st.duration);
});
function endPDrag() {
  if (!pDragging) return;
  pDragging = false;
  control("seek", pDragPct * st.duration);
}
$("pBar").addEventListener("pointerup", endPDrag);
$("pBar").addEventListener("pointercancel", endPDrag);

/* likes */
function toggleLike(item) {
  if (!item) return;
  const k = keyOf(item);
  liked = isLiked(item) ? liked.filter(x => keyOf(x) !== k) : [...liked, clean(item)];
  saveAll(); renderAll();
}

/* albums */
function createAlbumFromPage() {
  const name = $("albumName").value.trim();
  if (!name) return;
  albums.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name, tracks: [] });
  saveAll();
  $("albumName").value = "";
  renderAll();
}
function openSheet(item) { sheetItem = clean(item); renderSheet(); $("sheet").hidden = false; }
function closeSheet() { $("sheet").hidden = true; sheetItem = null; }
function renderSheet() {
  $("sheetList").innerHTML = albums.length
    ? albums.map(a => `<div class="album" data-act="pick" data-id="${esc(a.id)}">
        <div class="cover">♫</div>
        <div class="meta"><div class="t">${esc(a.name)}</div><div class="a">${a.tracks.length} songs</div></div></div>`).join("")
    : '<div class="muted">No albums yet. Create one in the Create tab.</div>';
}
function pickAlbum(id) {
  const a = albums.find(x => x.id === id);
  if (!a || !sheetItem) return;
  if (!a.tracks.some(t => keyOf(t) === keyOf(sheetItem))) a.tracks.push(sheetItem);
  saveAll(); closeSheet(); renderAll();
}
function removeTrack(i) { const a = openAlbum(); if (!a) return; a.tracks.splice(i, 1); saveAll(); renderAll(); }
function deleteAlbum() {
  const a = openAlbum(); if (!a) return;
  albums = albums.filter(x => x.id !== a.id);
  openAlbumId = null; saveAll(); renderAll();
}
function renderAlbums() {
  const a = openAlbum();
  if (openAlbumId && !a) openAlbumId = null;
  if (a) {
    $("albumsTitle").textContent = a.name;
    $("albumBack").hidden = false;
    $("newAlbumBox").hidden = true;
    $("albumTools").hidden = false;
    $("albumsBox").innerHTML = a.tracks.length
      ? a.tracks.map((t, i) => row(t, "album", i, { add: false, rm: true })).join("")
      : '<div class="muted">This album is empty. Tap + on any song to add it.</div>';
  } else {
    $("albumsTitle").textContent = "Albums";
    $("albumBack").hidden = true;
    $("newAlbumBox").hidden = false;
    $("albumTools").hidden = true;
    $("albumsBox").innerHTML = albums.length
      ? albums.map(al => `<div class="album" data-act="openalbum" data-id="${esc(al.id)}">
          <div class="cover">♫</div>
          <div class="meta"><div class="t">${esc(al.name)}</div><div class="a">${al.tracks.length} songs</div></div></div>`).join("")
      : '<div class="muted">No albums yet. Create one above.</div>';
  }
}

/* home: toggle chips filter the sections */
function renderHome() {
  document.querySelectorAll("#homeChips .chip").forEach(c => c.classList.toggle("on", c.dataset.filter === homeFilter));
  $("secRecents").hidden = homeFilter === "albums";
  $("secQueue").hidden = homeFilter === "albums";
  $("secAlbums").hidden = homeFilter === "music";

  const tiles = [
    `<button class="qp" data-tab="liked"><span class="qi" style="background:linear-gradient(135deg,#5b3cc4,#b9a6ff);color:#fff">♥</span><span class="lbl">Liked songs<small>${liked.length} songs</small></span></button>`,
    `<button class="qp" data-act="playall" data-list="liked" data-shuffle="1"><span class="qi">⤨</span><span class="lbl">Shuffle liked</span></button>`,
    ...albums.slice(0, 4).map(al => `<button class="qp" data-act="openalbum" data-id="${esc(al.id)}"><span class="qi">♫</span><span class="lbl">${esc(al.name)}<small>${al.tracks.length} songs</small></span></button>`)
  ];
  $("recentsBox").innerHTML = tiles.join("");

  $("homeAlbums").innerHTML = albums.length
    ? albums.map(al => `<button class="acard" data-act="openalbum" data-id="${esc(al.id)}">
        <div class="acover">♫</div>
        <div class="at">${esc(al.name)}</div>
        <div class="aa">${al.tracks.length} songs</div></button>`).join("")
    : '<div class="muted">No albums yet. Tap Create below.</div>';

  const q = queueItems();
  $("queue").innerHTML = q.length
    ? q.map((item, i) => row(item, "queue", i, { active: i === st.index })).join("")
    : '<div class="muted">Nothing queued yet.</div>';
}
function renderLibrary() {
  $("libLiked").textContent = liked.length ? `${liked.length} songs` : "Nothing yet";
  $("libAlbums").textContent = albums.length ? `${albums.length} albums` : "Nothing yet";
  $("libBox").innerHTML = albums.length
    ? albums.map(al => `<div class="album" data-act="openalbum" data-id="${esc(al.id)}">
        <div class="cover">♫</div>
        <div class="meta"><div class="t">${esc(al.name)}</div><div class="a">${al.tracks.length} songs</div></div></div>`).join("")
    : '<div class="muted">No albums yet.</div>';
}

/* date of birth: digits only, slashes added automatically */
function digitsOnly(s) { return String(s || "").replace(/\D/g, "").slice(0, 8); }
function maskDob(digits) {
  let out = digits.slice(0, 2);
  if (digits.length >= 2) out += "/" + digits.slice(2, 4);
  if (digits.length >= 4) out += "/" + digits.slice(4, 8);
  return out;
}
function displayToIso(s) {
  const m = String(s || "").match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if (!m) return "";
  const [_, d, mo, y] = m;
  const dt = new Date(`${y}-${mo}-${d}T00:00:00`);
  if (isNaN(dt) || dt.getDate() !== Number(d) || dt.getMonth() + 1 !== Number(mo)) return "";
  return `${y}-${mo}-${d}`;
}
function isoToDisplay(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-");
  return y && m && d ? `${d}/${m}/${y}` : "";
}
function syncCalendar() {
  const iso = displayToIso($("pfDobText").value);
  if (iso) $("pfDobPick").value = iso;
}

function renderProfileHeader() {
  const name = (profile.name || "").trim();
  $("pName").textContent = name || "Your profile";
  $("avatar").textContent = name ? name.charAt(0).toUpperCase() : "?";
}
function profileForm() {
  return `
    <div class="field"><label for="pfName">Name</label>
      <div class="well"><input id="pfName" value="${esc(profile.name)}" placeholder="Your name" autocomplete="off"></div></div>
    <div class="field"><label for="pfDobText">Date of birth</label>
      <div class="well">
        <input id="pfDobText" value="${esc(isoToDisplay(profile.dob))}" placeholder="DD/MM/YYYY" inputmode="numeric" autocomplete="off" maxlength="10">
        <label class="datepick" title="Pick from calendar"><span>📅</span>
          <input type="date" id="pfDobPick" value="${esc(profile.dob)}">
        </label>
      </div></div>
    <div class="field"><label for="pfEmail">Email</label>
      <div class="well"><input id="pfEmail" type="email" value="${esc(profile.email)}" placeholder="you@example.com" autocomplete="off"></div></div>
    <div class="row"><button class="primary" data-act="saveprofile">Save</button></div>
    <div class="note" id="pfNote"></div>`;
}
function saveProfile() {
  const name = $("pfName").value.trim();
  const dobText = $("pfDobText").value.trim();
  const dob = $("pfDobPick").value || displayToIso(dobText);
  const email = $("pfEmail").value.trim();
  if (dobText && !dob) { $("pfNote").textContent = "Date should be DD/MM/YYYY, or pick it from the calendar."; return; }
  profile = { name, dob, email };
  LS.set("snuffy.profile", profile);
  renderProfileHeader();
  $("pfNote").textContent = "Saved.";
}

/* side menu and full pages */
const PAGE_TITLES = { profile: "Profile", settings: "Settings", privacy: "Privacy Policy", terms: "Terms & Conditions" };
const LEGAL_FOOT = `<div class="legal">© 2026 Snuffy™. All rights reserved.</div>`;
const PAGES = {
  profile: () => profileForm(),
  settings: () => `
    <h3>Sound quality</h3>
    <p class="muted">Choose how audio should sound. Your choice is saved on this phone.</p>
    <select class="sel" onchange="LS.set('snuffy.quality', this.value)">
      <option value="auto" ${LS.get("snuffy.quality","auto")==="auto"?"selected":""}>Auto</option>
      <option value="high" ${LS.get("snuffy.quality","auto")==="high"?"selected":""}>High</option>
      <option value="data" ${LS.get("snuffy.quality","auto")==="data"?"selected":""}>Data saver</option>
    </select>
    ${LEGAL_FOOT}`,
  privacy: () => `
    <p class="updated">Last updated: October 2026</p>
    <p>Snuffy respects your privacy. This policy explains how the app handles information.</p>
    <h3>Contact</h3>
    <p>For questions about this policy, use the project page linked in Terms &amp; Conditions.</p>
    ${LEGAL_FOOT}`,
  terms: () => `
    <p class="updated">Last updated: October 2026</p>
    <p>By using Snuffy you agree to these terms. If you do not agree, please do not use the app.</p>
    <h3>Personal use</h3>
    <p>Snuffy is provided for personal, non-commercial use.</p>
    <h3>Your content</h3>
    <p>You are responsible for the files you open and the searches you make.</p>
    <h3>No warranty</h3>
    <p>Snuffy is provided as it is, without warranty of any kind. Availability of online songs depends on third-party services.</p>
    <h3>Changes</h3>
    <p>These terms may change. Continued use of the app means you accept the updated terms.</p>
    <h3>Project</h3>
    <p>Visit the project page: <a href="https://github.com/irfannzz18">github.com/irfannzz18</a></p>
    ${LEGAL_FOOT}`
};
function openDrawer() { $("drawer").classList.add("open"); $("scrim").hidden = false; }
function closeDrawer() { $("drawer").classList.remove("open"); $("scrim").hidden = true; }
function openPage(name) {
  $("pageTitle").textContent = PAGE_TITLES[name];
  $("pageBody").innerHTML = PAGES[name]();
  $("pageBody").scrollTop = 0;
  $("page").hidden = false;
  closeDrawer();
}
function closePage() { $("page").hidden = true; }

/* full-screen player */
function primaryArtist(a) { return String(a || "").split(",")[0].trim(); }
function openPlayer() {
  $("player").hidden = false;
  lyricsOpen = false;
  lyricsEditKey = null;
  bioEditKey = null;
  renderPlayer();
}
function closePlayer() { $("player").hidden = true; }

function renderPlayer() {
  if ($("player").hidden) return;
  const t = st.track || {};
  const item = currentItem();
  const isLikedNow = !!(item && isLiked(item));
  $("pFrom").textContent = primaryArtist(t.artist) || "Snuffy";
  $("pTitle").textContent = t.title || "Nothing playing";
  $("pArtist").textContent = t.artist || "";
  $("pCover").innerHTML = item && item.thumb ? `<img src="${esc(item.thumb)}" alt="">` : `<span>♫</span>`;
  const playing = st.state === "playing" && !st.paused;
  $("pPlay").textContent = (playing || st.state === "loading") ? "❚❚" : "▶";
  $("pShuffle").classList.toggle("on", !!st.shuffle);
  $("pRepeat").classList.toggle("on", !!st.repeat);
  $("pLike").textContent = isLikedNow ? "♥" : "♡";
  $("pLike").classList.toggle("on", isLikedNow);
  if (!pDragging) {
    const pos = st.position || 0, dur = st.duration || 0;
    paintPlayerBar(dur ? Math.min(1, pos / dur) : 0, pos);
  }
  $("pDur").textContent = fmt(st.duration || 0);
  renderLyrics();
  renderArtist();
}

/* lyrics: you paste them in, saved per song on this phone */
function lyricKey() { const it = currentItem(); return it ? keyOf(it) : null; }
function renderLyrics() {
  const key = lyricKey();
  const text = key ? (lyrics[key] || "") : "";
  const editing = lyricsEditKey !== null;
  $("lyrEditor").hidden = !editing;
  $("lyrEdit").hidden = editing || !key;
  $("lyrEdit").textContent = text ? "Edit lyrics" : "Add lyrics";
  $("lyrToggle").hidden = editing || !text;
  if (editing) return;
  if (!key) {
    $("lyrBody").textContent = "Play a song to see its lyrics.";
    return;
  }
  if (!text) {
    $("lyrBody").textContent = "No lyrics for this song yet. Tap Add lyrics to paste them.";
    return;
  }
  const lines = text.split("\n").filter(l => l.trim());
  const shown = lyricsOpen ? lines : lines.slice(0, 3);
  $("lyrBody").innerHTML = shown.map(esc).join("<br>");
  $("lyrToggle").textContent = lyricsOpen ? "Hide lyrics" : "Show lyrics";
}
function startLyricsEdit() {
  const key = lyricKey();
  if (!key) return;
  lyricsEditKey = key;
  $("lyrText").value = lyrics[key] || "";
  renderLyrics();
  $("lyrText").focus();
}
function saveLyrics() {
  if (lyricsEditKey === null) return;
  const v = $("lyrText").value.trim();
  if (v) lyrics[lyricsEditKey] = v; else delete lyrics[lyricsEditKey];
  LS.set("snuffy.lyrics", lyrics);
  lyricsEditKey = null;
  renderLyrics();
}
function cancelLyrics() { lyricsEditKey = null; renderLyrics(); }

/* artist: your own notes, plus quick searches */
function artistName() { return primaryArtist((st.track || {}).artist); }
function renderArtist() {
  const name = artistName();
  const editing = bioEditKey !== null;
  $("aName").textContent = name || "Unknown artist";
  $("aAvatar").textContent = name ? name.charAt(0).toUpperCase() : "♫";
  $("bioText").hidden = editing;
  $("bioText").textContent = name
    ? (artistBios[name] || "No notes about this artist yet. Tap Edit to add some.")
    : "Play a song to see its artist.";
  $("bioEditor").hidden = !editing;
  $("bioEdit").hidden = editing || !name;
  $("artistActs").hidden = editing;
}
function startBioEdit() {
  const name = artistName();
  if (!name) return;
  bioEditKey = name;
  $("bioInput").value = artistBios[name] || "";
  renderArtist();
  $("bioInput").focus();
}
function saveBio() {
  if (bioEditKey === null) return;
  const v = $("bioInput").value.trim();
  if (v) artistBios[bioEditKey] = v; else delete artistBios[bioEditKey];
  LS.set("snuffy.artists", artistBios);
  bioEditKey = null;
  renderArtist();
}
function cancelBio() { bioEditKey = null; renderArtist(); }

function searchFor(q) {
  if (!q) return;
  closePlayer();
  $("q").value = q;
  setView("search");
  search();
}

/* rendering */
function render() {
  const t = st.track || {};
  const playing = st.state === "playing" && !st.paused;
  $("mini").hidden = !t.title;
  $("miniTitle").textContent = t.title || "";
  $("miniArtist").textContent = t.artist || "";
  $("miniPlay").textContent = (playing || st.state === "loading") ? "❚❚" : "▶";
  const sig = `${queueItems().length}:${st.index}:${st.state}:${liked.length}:${t.title || ""}`;
  if (sig !== queueSig) { queueSig = sig; renderHome(); }
  renderPlayer();
}
function renderSearch() {
  $("resultsPanel").hidden = !lastResults.length && !$("results").dataset.busy;
  $("results").innerHTML = lastResults.map((r, i) => row(r, "search", i)).join("");
}
function renderLiked() {
  $("likedCount").textContent = liked.length ? `${liked.length} songs` : "";
  $("likedBox").innerHTML = liked.length
    ? liked.map((t, i) => row(t, "liked", i, { add: false })).join("")
    : '<div class="muted">No liked songs yet. Tap ♡ on any song.</div>';
}
function renderAll() {
  queueSig = "";
  renderHome(); renderSearch(); renderLiked(); renderAlbums(); renderLibrary(); renderProfileHeader();
  renderPlayer();
  if (!$("sheet").hidden) renderSheet();
}

const TAB_FOR = { home: "home", search: "search", library: "library", albums: "library", liked: "library" };
function setView(name, tabName) {
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === "view-" + name));
  const activeTab = tabName || TAB_FOR[name];
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.tab === activeTab));
  if (name === "liked") renderLiked();
  if (name === "albums") renderAlbums();
  if (name === "library") renderLibrary();
  if (name === "home") renderHome();
  $("screen").scrollTo({top: 0});
}
async function refresh() {
  try { st = await fetch("/api/status").then(r => r.json()); render(); } catch (e) {}
}

/* search */
async function search() {
  const q = $("q").value.trim();
  if (!q) return;
  $("resultsPanel").hidden = false;
  $("results").dataset.busy = "1";
  $("results").innerHTML = '<div class="muted">Searching…</div>';
  try {
    const r = await fetch("/api/search?q=" + encodeURIComponent(q)).then(r => r.json());
    lastResults = r.results || [];
  } catch (e) { lastResults = []; }
  delete $("results").dataset.busy;
  renderSearch();
  if (!lastResults.length) $("results").innerHTML = '<div class="muted">No results.</div>';
}

/* events */
document.addEventListener("click", e => {
  const page = e.target.closest("[data-page]");
  if (page) return openPage(page.dataset.page);
  const filter = e.target.closest("[data-filter]");
  if (filter) { homeFilter = filter.dataset.filter; return renderHome(); }
  const tab = e.target.closest("[data-tab]");
  if (tab) {
    if (tab.dataset.tab === "create") return setView("albums", "create");
    return setView(tab.dataset.tab);
  }
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act;
  const list = b.dataset.list;
  const i = Number(b.dataset.i);
  const items = list ? getList(list) : null;
  switch (act) {
    case "ctrl":        control(b.dataset.c); break;
    case "pickfile":    openFilePicker(); break;
    case "openplayer":  openPlayer(); break;
    case "closeplayer": closePlayer(); break;
    case "likenow":     toggleLike(currentItem()); break;
    case "play":        playList(items, i); break;
    case "like":        toggleLike(items[i]); break;
    case "addalbum":    openSheet(items[i]); break;
    case "pick":        pickAlbum(b.dataset.id); break;
    case "closesheet":  closeSheet(); break;
    case "createalbum": createAlbumFromPage(); break;
    case "openalbum":   openAlbumId = b.dataset.id; setView("albums", "library"); break;
    case "backalbum":   openAlbumId = null; renderAlbums(); break;
    case "delalbum":    deleteAlbum(); break;
    case "rmtrack":     removeTrack(i); break;
    case "saveprofile": saveProfile(); break;
    case "editlyrics":  startLyricsEdit(); break;
    case "savelyrics":  saveLyrics(); break;
    case "cancellyrics":cancelLyrics(); break;
    case "togglelyrics": lyricsOpen = !lyricsOpen; renderLyrics(); break;
    case "editbio":     startBioEdit(); break;
    case "savebio":     saveBio(); break;
    case "cancelbio":   cancelBio(); break;
    case "songsby":     searchFor(artistName()); break;
    case "similar":     searchFor(((st.track || {}).title || "") + " " + artistName()); break;
    case "playall": {
      let l = [...getList(list)];
      if (b.dataset.shuffle) l.sort(() => Math.random() - 0.5);
      playList(l, 0); break;
    }
  }
});

/* date field: digits only, slashes added automatically */
document.addEventListener("input", e => {
  if (e.target.id !== "pfDobText") return;
  e.target.value = maskDob(digitsOnly(e.target.value));
  syncCalendar();
});
document.addEventListener("keydown", e => {
  if (e.target.id !== "pfDobText" || e.key !== "Backspace") return;
  e.preventDefault();
  e.target.value = maskDob(digitsOnly(e.target.value).slice(0, -1));
  syncCalendar();
});
document.addEventListener("change", e => {
  if (e.target.id === "pfDobPick" && e.target.value) {
    const [y, m, d] = e.target.value.split("-");
    $("pfDobText").value = `${d}/${m}/${y}`;
  }
});

$("themeBtn").onclick = toggleTheme;
$("setBtn").onclick = openDrawer;
$("scrim").onclick = closeDrawer;
$("pageBack").onclick = closePage;
$("albumName").addEventListener("keydown", e => { if (e.key === "Enter") createAlbumFromPage(); });
$("sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeSheet(); });
$("goBtn").onclick = search;
$("q").addEventListener("keydown", e => { if (e.key === "Enter") search(); });

applyTheme();
renderAll();
refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
